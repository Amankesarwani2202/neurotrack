{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Cookie Theft Picture</h2>
  <p class="muted">Choose the one statement that correctly describes the picture.</p>

  <div class="center" style="margin-top:16px">
    <img id="cookieImage" src="/static/images/cookie_theft.jpg" alt="Cookie Theft scene" style="max-width:100%; border:1px solid #ddd; border-radius:12px; background:#fff" />
  </div>

  <div id="options" style="margin-top:16px;"></div>

  <div class="row" style="margin-top:16px;">
    <button class="btn" id="btnScoreCookie">Submit Answers</button>
  </div>

  <div id="cookieResult" class="muted" style="margin-top:12px">No score yet.</div>
  <div id="nextBtnContainer" class="row" style="margin-top:15px; display:none;"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
const cookieItems = [
  {id:'dishes', text:'The woman is washing dishes.', correct:true},
  {id:'clothes', text:'The woman is washing clothes.', correct:false},
  {id:'kids_running', text:'The kids are running.', correct:false},
  {id:'clothes_drying', text:'The clothes are drying.', correct:false},
  {id:'phone', text:'Someone is talking on the phone.', correct:false},
  {id:'dog', text:'A dog is under the table.', correct:false}
];

function shuffle(a) { return a.sort(()=>Math.random()-0.5); }
const randomized = shuffle([...cookieItems]);
const optionsEl = document.getElementById('options');
optionsEl.innerHTML = randomized.map(item => `
  <label style="display:block; margin-bottom:8px;">
    <input type="radio" name="cookieAnswer" data-id="${item.id}"> ${item.text}
  </label>
`).join('');

function calculateCookieScore() {
  const checks = Array.from(optionsEl.querySelectorAll('input[type=radio]'));
  let correctCount = 0, wrongCount = 0;
  let selectedCount = 0;
  checks.forEach(box => {
    if (!box.checked) return;
    selectedCount++;
    const item = cookieItems.find(i=>i.id===box.dataset.id);
    if (!item) return;
    if (item.correct) { correctCount++; }
    else { wrongCount++; }
  });
  return {correctCount, wrongCount, score: selectedCount === 1 && correctCount === 1 ? 100 : 0};
}

document.getElementById('btnScoreCookie').addEventListener('click', () => {
  const result = calculateCookieScore();
  const payload = {
    selected: randomized.filter((item, index) => optionsEl.querySelectorAll('input[type=radio]')[index].checked).map(item=>item.id),
    score: result.score,
    correct_count: result.correctCount,
    distractor_count: result.wrongCount,
    saved_at: Date.now()
  };
  localStorage.setItem('neuro_cookie', JSON.stringify(payload));
  document.getElementById('cookieResult').textContent = `Score: ${result.score} (correct ${result.correctCount}, incorrect ${result.wrongCount})`;
  document.getElementById('nextBtnContainer').style.display = 'flex';
  addNextButton('nextBtnContainer', 'Letter Search', '/letter-search');
});
</script>
{% endblock %}
